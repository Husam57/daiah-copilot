# Render Blueprint — الـ Backend (FastAPI). الشرح الكامل في docs/deploy.md
# القيم السرية لا تُكتب هنا أبداً: sync: false يجعل Render يطلبها منك عند إنشاء الخدمة.
services:
  - type: web
    name: daiah-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      # رابط الواجهة على Vercel (بلا / في النهاية)، وعدة روابط مفصولة بفواصل
      - key: CORS_ORIGINS
        sync: false
