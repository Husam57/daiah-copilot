<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>القائمة الجانبية للوحة التحكم</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="القائمة الجانبية" dir="rtl" style="font-family: Tajawal, sans-serif; color: #1C1F1E; width: 100%; height: 100%; min-height: 1100px; box-sizing: border-box; background: #FFFFFF; border-inline-end: 1px solid #E7E5DF; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px">
<span style="width: 34px; height: 34px; border-radius: 9px; background: #0F4C47; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-weight: 800; font-size: 17px; color: #0F4C47">رفيق الداعية</span><span style="font-size: 12px; color: #6B726E">لوحة التحكم</span></span>
</div>
<nav aria-label="لوحة التحكم" style="display: flex; flex-direction: column; gap: 18px; font-size: 14px">
<sc-for list="{{groups}}" as="group" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 2px">
<sc-if value="{{group.hasTitle}}" hint-placeholder-val="{{ true }}">
<span style="padding: 0 10px 6px; font-size: 12px; font-weight: 700; color: #6B726E">{{group.title}}</span>
</sc-if>
<sc-for list="{{group.items}}" as="item" hint-placeholder-count="3">
<sc-if value="{{item.enabled}}" hint-placeholder-val="{{ true }}">
<a href="{{item.href}}" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 10px; background: {{item.bg}}; color: {{item.color}}; font-weight: {{item.weight}}; text-decoration: none">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{item.stroke}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
<span style="flex: 1 1 auto">{{item.label}}</span>
<sc-if value="{{item.hasBadge}}" hint-placeholder-val="{{ false }}">
<span style="min-width: 22px; height: 22px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: {{item.badgeBg}}; color: {{item.badgeColor}}; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{item.badge}}</span>
</sc-if>
</a>
</sc-if>
<sc-if value="{{item.soon}}" hint-placeholder-val="{{ false }}">
<span aria-disabled="true" style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; color: #6B726E">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A9B0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="{{item.icon}}"></path></svg>
<span style="flex: 1 1 auto">{{item.label}}</span>
<span style="padding: 2px 8px; border-radius: 999px; background: #F4F3EF; font-size: 11px; font-weight: 700; color: #5B625F">قريباً</span>
</span>
</sc-if>
</sc-for>
</div>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px 10px; border-top: 1px solid #E7E5DF">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #E3F1EE; color: #0F4C47; font-weight: 700; display: flex; align-items: center; justify-content: center">م</span>
<span style="display: flex; flex-direction: column; flex: 1 1 auto"><span style="font-size: 14px; font-weight: 700">المدير</span><span style="font-size: 12px; color: #6B726E">حسابي</span></span>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","sections","posts","review","settings","rag","lab","unanswered","referrals"],"default":"home"},"$preview":{"width":248,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'home';
const I = {
home: 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z',
sections: 'M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z',
posts: 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h5',
review: 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
settings: 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M2 14h4M10 8h4M18 16h4',
rag: 'M3 5a9 3 0 1 0 18 0a9 3 0 1 0-18 0M3 5v14a9 3 0 0 0 18 0V5M3 12a9 3 0 0 0 18 0',
lab: 'M9 3h6M10 3v6.5L4.5 19a1.5 1.5 0 0 0 1.3 2h12.4a1.5 1.5 0 0 0 1.3-2L14 9.5V3',
unanswered: 'M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01',
referrals: 'M3 21h18M5 21V7l7-4 7 4v14M9 21v-6h6v6',
users: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8a4 4 0 1 0 0-8'
};
const raw = [
{ title: '', items: [{ key: 'home', label: 'الرئيسية', href: '/AdminDashboard.dc.html' }] },
{ title: 'المحتوى', items: [
{ key: 'sections', label: 'الأقسام', href: '/AdminSections.dc.html' },
{ key: 'posts', label: 'المنشورات', href: '/AdminPosts.dc.html' },
{ key: 'review', label: 'المراجعة', href: '#', badge: '3', tone: 'warn' }
] },
{ title: 'الذكاء الاصطناعي', items: [
{ key: 'settings', label: 'الإعدادات والتعليمات', href: '/AdminAISettings.dc.html' },
{ key: 'rag', label: 'قاعدة المعرفة (RAG)', href: '#' },
{ key: 'lab', label: 'مختبر الاختبار', href: '/AdminLab.dc.html' },
{ key: 'unanswered', label: 'الأسئلة غير المجابة', href: '/AdminUnanswered.dc.html', badge: '7', tone: 'danger' }
] },
{ title: 'الإدارة', items: [
{ key: 'referrals', label: 'المراكز المعتمدة', href: '#' },
{ key: 'users', label: 'المستخدمون', href: '#', soon: true }
] }
];
const groups = raw.map((g) => ({
title: g.title,
hasTitle: g.title !== '',
items: g.items.map((it) => {
const on = it.key === active;
return {
...it,
icon: I[it.key],
enabled: !it.soon,
soon: !!it.soon,
bg: on ? '#E3F1EE' : 'transparent',
color: on ? '#0F4C47' : '#1C1F1E',
weight: on ? 700 : 500,
stroke: on ? '#0F4C47' : '#5B625F',
hasBadge: !!it.badge,
badgeBg: it.tone === 'danger' ? '#FBEAE8' : '#FDF3E1',
badgeColor: it.tone === 'danger' ? '#8F2A24' : '#8A5A12'
};
})
}));
return { groups };
}
}
</script>
</body>
</html>
