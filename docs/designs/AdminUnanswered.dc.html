<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة التحكم — الأسئلة غير المجابة</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF7}
a{color:#14645C}a:hover{color:#0F4C47}
</style>
</helmet>
<div dir="rtl" style="font-family: Tajawal, sans-serif; color: #1C1F1E; background: #FAFAF7; min-height: 100%; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 248px; max-width: 100%; display: flex">
<dc-import name="AdminSidebar" active="unanswered" hint-size="248px,1100px"></dc-import>
</div>

<main style="flex: 999 1 760px; min-width: 0; display: flex; flex-direction: column">
<div style="background: #FFFFFF; border-bottom: 1px solid #E7E5DF; padding: 14px 32px; display: flex; gap: 8px; font-size: 14px; color: #6B726E">
<span>الذكاء الاصطناعي</span><span aria-hidden="true">/</span><span style="color: #1C1F1E; font-weight: 700">الأسئلة غير المجابة</span>
</div>

<div style="padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 20px; max-width: 1240px; box-sizing: border-box; width: 100%">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 640px"><h1 style="margin: 0; font-size: 26px; line-height: 38px; font-weight: 700">الأسئلة غير المجابة</h1><span style="font-size: 15px; line-height: 26px; color: #5B625F">أسئلة لم يجد لها المساعد مادة معتمدة كافية. هذه خريطتك للمحتوى الناقص: أنشئ لها منشورات، وستُجاب تلقائياً بعد النشر.</span></div>
<select aria-label="الفترة" style="height: 42px; padding: 0 12px; border: 1px solid #E7E5DF; border-radius: 10px; background: #FFFFFF; font-family: Tajawal, sans-serif; font-size: 14px"><option>آخر ٧ أيام</option><option>آخر ٣٠ يوماً</option><option>الكل</option></select>
</div>

<div style="background: #FFFFFF; border: 1px solid #E7E5DF; border-radius: 16px; overflow-x: auto">
<table style="width: 100%; min-width: 860px; border-collapse: collapse; font-size: 14px">
<thead>
<tr style="background: #F4F3EF; color: #5B625F">
<th scope="col" style="padding: 12px 18px; text-align: start; font-weight: 700">السؤال</th>
<th scope="col" style="padding: 12px 18px; text-align: start; font-weight: 700">التكرار</th>
<th scope="col" style="padding: 12px 18px; text-align: start; font-weight: 700">التصنيف</th>
<th scope="col" style="padding: 12px 18px; text-align: start; font-weight: 700">أقرب مادة</th>
<th scope="col" style="padding: 12px 18px; text-align: start; font-weight: 700">آخر مرة</th>
<th scope="col" style="padding: 12px 18px; text-align: start; font-weight: 700"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">إجراءات</span></th>
</tr>
</thead>
<tbody>
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<tr style="border-top: 1px solid #F0EFEA">
<td style="padding: 14px 18px; font-size: 15px; font-weight: 500; max-width: 340px">{{r.q}}</td>
<td style="padding: 14px 18px"><span style="padding: 4px 10px; border-radius: 8px; background: #FBEAE8; color: #8F2A24; font-size: 12px; font-weight: 700">[ن] مرات</span></td>
<td style="padding: 14px 18px; color: #5B625F">{{r.cat}}</td>
<td style="padding: 14px 18px"><span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #1C1F1E">{{r.closest}}</span><span lang="en" style="font-size: 12px; color: #6B726E">{{r.score}}</span></span></td>
<td style="padding: 14px 18px; color: #6B726E">[التاريخ]</td>
<td style="padding: 14px 18px"><span style="display: flex; gap: 6px; justify-content: flex-end">
<a href="/AdminEditor.dc.html" style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 10px; background: #0F4C47; color: #FFFFFF; font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap">أنشئ منشوراً</a>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid #E7E5DF; background: #FFFFFF; font-family: Tajawal, sans-serif; font-size: 13px; font-weight: 700; color: #5B625F; cursor: pointer">تجاهل</button>
</span></td>
</tr>
</sc-for>
</tbody>
</table>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
{ q: 'ما حكم المشاركة في احتفالات غير المسلمين؟', cat: 'غير محدد', closest: 'فن الحوار مع الآخر', score: '0.48' },
{ q: 'كيف أشرح مفهوم القدر لغير المسلم؟', cat: 'أساليب الدعوة', closest: 'التعريف بالألوهية أولاً', score: '0.52' },
{ q: 'ما المادة المناسبة لمن يسأل عن الصيام؟', cat: 'المسلم الجديد', closest: 'خطواتك الأولى في الإسلام', score: '0.55' },
{ q: 'هل الإسلام انتشر بالسيف؟', cat: 'موسوعة الشبهات', closest: 'الإسلام والسلام', score: '0.51' },
{ q: 'كيف أتعامل مع أهلي بعد إسلامي؟', cat: 'المسلم الجديد', closest: '—', score: '' },
{ q: 'ما الفرق بين القرآن والحديث؟', cat: 'التعريف بالإسلام', closest: 'القرآن الكريم: نظرة تعريفية', score: '0.57' }
];
return { rows };
}
}
</script>
</body>
</html>
