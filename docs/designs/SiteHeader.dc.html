<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>رأس الموقع</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<header dir="rtl" style="font-family: Tajawal, sans-serif; color: #1C1F1E; background: #FFFFFF; border-bottom: 1px solid #E7E5DF; width: 100%">
<div style="max-width: 1200px; margin: 0 auto; padding: 14px 32px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 18px">
<a href="/Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #0F4C47">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #0F4C47; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h7z"></path></svg></span>
<span style="font-weight: 800; font-size: 20px">رفيق الداعية</span>
</a>
<nav aria-label="التنقل الرئيسي" style="display: flex; flex-wrap: wrap; gap: 26px; font-size: 15px">
<sc-for list="{{links}}" as="link" hint-placeholder-count="4">
<a href="{{link.href}}" style="color: {{link.color}}; font-weight: {{link.weight}}; text-decoration: none">{{link.label}}</a>
</sc-for>
</nav>
<div style="display: flex; align-items: center; gap: 14px">
<a href="#" lang="en" style="font-size: 14px; font-weight: 500; color: #5B625F; text-decoration: none">English</a>
<a href="/Assistant.dc.html" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border-radius: 12px; background: #0F4C47; color: #FFFFFF; font-weight: 700; font-size: 15px; text-decoration: none">اسأل رفيق الداعية</a>
</div>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["library","shubuhat","intro","newmuslim","none"],"default":"none"},"$preview":{"width":1440,"height":72}}'>
class Component extends DCLogic {
renderVals() {
const active = this.props.active ?? 'none';
const base = [
{ key: 'library', label: 'المكتبة', href: '/Library.dc.html' },
{ key: 'shubuhat', label: 'موسوعة الشبهات', href: '/Shubuhat.dc.html' },
{ key: 'intro', label: 'التعريف بالإسلام', href: '/IntroMaterials.dc.html' },
{ key: 'newmuslim', label: 'المسلم الجديد', href: '/NewMuslim.dc.html' }
];
return {
links: base.map((l) => ({ ...l, color: l.key === active ? '#0F4C47' : '#5B625F', weight: l.key === active ? 700 : 500 }))
};
}
}
</script>
</body>
</html>
