<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>لوحة التحكم — الأقسام</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAFAF7}
a{color:#14645C}a:hover{color:#0F4C47}
</style>
</helmet>
<div dir="rtl" style="font-family: Tajawal, sans-serif; color: #1C1F1E; background: #FAFAF7; min-height: 100%; display: flex; flex-wrap: wrap; align-items: stretch">
<div style="flex: 1 1 248px; max-width: 100%; display: flex">
<dc-import name="AdminSidebar" active="sections" hint-size="248px,1100px"></dc-import>
</div>

<main style="flex: 999 1 760px; min-width: 0; display: flex; flex-direction: column">
<div style="background: #FFFFFF; border-bottom: 1px solid #E7E5DF; padding: 14px 32px; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #6B726E">
<span>المحتوى</span><span aria-hidden="true">/</span><span style="color: #1C1F1E; font-weight: 700">الأقسام</span>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: flex-start">
<div style="flex: 999 1 560px; min-width: 0; padding: 28px 32px 48px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 26px; line-height: 38px; font-weight: 700">الأقسام</h1><span style="font-size: 15px; color: #5B625F">نظّم المحتوى في أقسام وأقسام فرعية، مثل تصنيفات المدونات.</span></div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #0F4C47; color: #FFFFFF; font-family: Tajawal, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>قسم جديد</button>
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="5">
<div style="background: #FFFFFF; border: 1px solid #E7E5DF; border-radius: 16px; padding: 18px 20px; margin-inline-start: {{s.indent}}; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<span style="flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; background: #E3F1EE; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#14645C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2z"></path></svg></span>
<span style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span style="font-size: 17px; font-weight: 700">{{s.name}}</span><span lang="en" style="font-size: 13px; color: #6B726E">{{s.en}}</span></span>
<span style="font-size: 14px; color: #5B625F">{{s.desc}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 70px"><span style="font-size: 18px; font-weight: 700">[ع]</span><span style="font-size: 12px; color: #6B726E">منشور</span></span>
<span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 8px; background: {{s.stBg}}; color: {{s.stInk}}; font-size: 12px; font-weight: 700">{{s.status}}</span>
<span style="display: flex; gap: 4px">
<button type="button" aria-label="تعديل القسم" style="width: 38px; height: 38px; border: 1px solid #E7E5DF; border-radius: 10px; background: #FFFFFF; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg></button>
<a href="/AdminPosts.dc.html" aria-label="منشورات القسم" style="width: 38px; height: 38px; box-sizing: border-box; border: 1px solid #E7E5DF; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1C1F1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg></a>
<button type="button" aria-label="حذف القسم" title="لا يمكن حذف قسم فيه منشورات" disabled style="width: 38px; height: 38px; border: 1px solid #E7E5DF; border-radius: 10px; background: #F4F3EF; cursor: not-allowed; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A9B0AC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path></svg></button>
</span>
</div>
</sc-for>
</div>
</div>

<aside aria-label="قسم جديد" style="flex: 1 1 340px; min-width: 0; box-sizing: border-box; align-self: stretch; background: #FFFFFF; border-inline-start: 1px solid #E7E5DF; padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 16px 40px rgba(16,24,20,0.08)">
<div style="display: flex; justify-content: space-between; align-items: center"><h2 style="margin: 0; font-size: 19px; font-weight: 700">قسم جديد</h2><button type="button" aria-label="إغلاق" style="width: 36px; height: 36px; border: 0; border-radius: 10px; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B625F" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"></path><path d="m6 6 12 12"></path></svg></button></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="n-ar" style="font-size: 14px; font-weight: 700">الاسم بالعربية</label><input id="n-ar" type="text" style="height: 44px; padding: 0 12px; border: 1px solid #E7E5DF; border-radius: 10px; font-family: Tajawal, sans-serif; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="n-en" style="font-size: 14px; font-weight: 700">الاسم بالإنجليزية</label><input id="n-en" type="text" dir="ltr" style="height: 44px; padding: 0 12px; border: 1px solid #E7E5DF; border-radius: 10px; font-family: Tajawal, sans-serif; font-size: 15px"></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="n-cat" style="font-size: 14px; font-weight: 700">المسار</label><select id="n-cat" style="height: 44px; padding: 0 12px; border: 1px solid #E7E5DF; border-radius: 10px; background: #FFFFFF; font-family: Tajawal, sans-serif; font-size: 15px"><option>أساليب ومنهجية الدعوة</option><option>موسوعة الشبهات والردود</option><option>مواد التعريف بالإسلام</option><option>حقيبة المسلم الجديد</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="n-parent" style="font-size: 14px; font-weight: 700">القسم الأب <span style="font-weight: 500; color: #6B726E">(اختياري)</span></label><select id="n-parent" style="height: 44px; padding: 0 12px; border: 1px solid #E7E5DF; border-radius: 10px; background: #FFFFFF; font-family: Tajawal, sans-serif; font-size: 15px"><option>بدون — قسم رئيسي</option></select></div>
<div style="display: flex; flex-direction: column; gap: 8px"><label for="n-desc" style="font-size: 14px; font-weight: 700">الوصف</label><textarea id="n-desc" rows="3" style="resize: vertical; padding: 10px 12px; border: 1px solid #E7E5DF; border-radius: 10px; font-family: Tajawal, sans-serif; font-size: 15px"></textarea></div>
<label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #0F4C47">مفعّل ويظهر في الموقع</label>
<div style="display: flex; gap: 8px; margin-top: auto"><button type="button" style="flex: 1 1 auto; height: 44px; border: 0; border-radius: 12px; background: #0F4C47; color: #FFFFFF; font-family: Tajawal, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">حفظ القسم</button><button type="button" style="height: 44px; padding: 0 18px; border: 1px solid #E7E5DF; border-radius: 12px; background: #FFFFFF; font-family: Tajawal, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">إلغاء</button></div>
</aside>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
renderVals() {
const on = { status: 'مفعّل', stBg: '#E6F4EC', stInk: '#17633D' };
const off = { status: 'موقوف', stBg: '#F4F3EF', stInk: '#5B625F' };
const sections = [
{ ...on, indent: '0px', name: 'أساليب ومنهجية الدعوة', en: 'Da&#39;wah Methodology', desc: 'فنون الحوار والتدرج، وأولوية التوحيد قبل الأحكام.' },
{ ...on, indent: '0px', name: 'موسوعة الشبهات والردود', en: 'Doubts &amp; Responses', desc: 'تفنيد علمي وشرعي موثق لأبرز الشبهات.' },
{ ...on, indent: '40px', name: 'شبهات حول القرآن', en: 'About the Quran', desc: 'قسم فرعي من موسوعة الشبهات.' },
{ ...on, indent: '0px', name: 'مواد التعريف بالإسلام', en: 'Introducing Islam', desc: 'كتيبات ومطويات ومقالات للإهداء.' },
{ ...off, indent: '0px', name: 'حقيبة المسلم الجديد', en: 'New Muslim Kit', desc: 'أركان العبادات والاندماج السليم.' }
];
sections[0].en = 'Da’wah Methodology';
sections[1].en = 'Doubts and Responses';
return { sections };
}
}
</script>
</body>
</html>
